name: Canicas Mexicanas Production CI/CD & Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-quality:
    name: Rust Backend Quality, Tests & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Precompiled cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run RustSec Vulnerability Audit
        run: cargo audit
        continue-on-error: true

      - name: Cargo Format Check
        run: cargo fmt -- --check

      - name: Cargo Check
        run: cargo check --all-targets

      - name: Cargo Clippy Linter (Zero Warnings Allowed)
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Test Suite
        run: cargo test --all-targets --verbose

      - name: Build Release Binary
        run: cargo build --release

  frontend-quality:
    name: Frontend Syntax Check & Standalone Bundler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node -c public/app.js
          node -c public/audio.js
          node -c public/sw.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Standalone Artifact Bundler
        run: |
          python3 bundle_standalone.py dist/canicas_standalone.html
          test -f dist/canicas_standalone.html
          echo "Standalone artifact bundle generated successfully!"

  docker-security-scan:
    name: Container Build & Trivy CVE Scan
    needs: [rust-quality, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Application Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: canicas:ci

      - name: Run Trivy Vulnerability Scanner on Container Image
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --exit-code 0 \
            canicas:ci
